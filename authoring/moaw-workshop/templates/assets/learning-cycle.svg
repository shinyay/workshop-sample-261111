<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900" role="img" aria-labelledby="practice-title practice-description">
  <title id="practice-title">A practice loop with an explicit check and retry path</title>
  <desc id="practice-description">Read the goal, make one small change, and compare the result with the expected conditions. If it does not match, revisit the inputs or change and check again. If it matches, record the evidence and remaining unknowns. This is an illustrative workflow, not a record of a successful exercise.</desc>
  <defs>
    <marker id="practice-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#527561"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #183d2a; }
      .title { font-size: 32px; font-weight: 700; }
      .label { font-size: 28px; font-weight: 600; }
      .body { font-size: 24px; fill: #40554a; }
      .note { font-size: 22px; fill: #40554a; }
      .card { fill: #fff; stroke: #b8cdbf; stroke-width: 2; }
      .link { fill: none; stroke: #527561; stroke-width: 3; marker-end: url(#practice-arrow); }
    </style>
  </defs>
  <rect width="560" height="900" rx="20" fill="#f2f7f3"/>
  <text x="40" y="44" class="title">Follow a practice loop</text>
  <text x="40" y="78" class="note">Use the process to guide an exercise.</text>
  <text x="40" y="108" class="note">It is not a record of a passed check.</text>
  <g>
    <rect x="72" y="140" width="416" height="126" rx="12" class="card"/>
    <text x="96" y="179" class="label">1. Read the goal</text>
    <text x="96" y="217" class="body">Read the expected result.</text>
    <text x="96" y="248" class="body">Note inputs and constraints.</text>
    <rect x="72" y="312" width="416" height="126" rx="12" class="card"/>
    <text x="96" y="351" class="label">2. Make one change</text>
    <text x="96" y="389" class="body">Change one small part.</text>
    <text x="96" y="420" class="body">Keep the goal in view.</text>
    <rect x="72" y="484" width="416" height="126" rx="12" class="card"/>
    <text x="96" y="523" class="label">3. Check the result</text>
    <text x="96" y="561" class="body">Compare with the goal.</text>
    <text x="96" y="592" class="body">Keep unexpected outcomes.</text>
    <rect x="72" y="716" width="416" height="126" rx="12" class="card"/>
    <text x="96" y="755" class="label">Explain the evidence</text>
    <text x="96" y="793" class="body">Record what you checked.</text>
    <text x="96" y="824" class="body">State what is still unknown.</text>
  </g>
  <path d="M280 266V304" class="link"/>
  <path d="M280 438V476" class="link"/>
  <path d="M176 610V660H24V203H64" class="link" stroke-dasharray="7 5"/>
  <text x="64" y="692" class="note">Not yet: revise and try again</text>
  <path d="M384 610V708" class="link"/>
  <text x="396" y="667" class="note">Matches</text>
  <text x="40" y="883" class="note">Record actual results and limitations.</text>
</svg>
